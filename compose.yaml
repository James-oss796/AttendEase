services:

  db:
    image: postgres:18
    container_name: AttendEase-db
    restart: unless-stopped

    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  backend: 
    build:
      context: ./backend
    container_name: AttendEase-backend
    restart: unless-stopped

    environment:
        NODE_ENV: development
        PORT: 5000

        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    ports:
        - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: AttendEase-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
